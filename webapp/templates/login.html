{% extends "base.html" %}
{% block title %}Sign in · {{ APP_TITLE }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<div class="banner error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input type="text" name="username" value="{{ username }}" required autocomplete="username"
             autocapitalize="none" spellcheck="false" {{ 'autofocus' if not username }}>
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password" {{ 'autofocus' if username }}>
    </label>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
